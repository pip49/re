
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>검색 아카이브</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            position: relative;
            min-height: 100vh;
        }

        /* 배경 이미지 설정 및 투명도 0.2 적용 */
        body::before {
            content: "";
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.7;
            z-index: -1;
        }

        .list-header { background: #18bc9c; color: white; padding: 30px 0; margin-bottom: 30px; }
        .list-header h2 { font-size: 2rem; }
        .search-container { max-width: 600px; margin: 0 auto 30px auto; }
        .post-table-container { background: white; border-radius: 10px; overflow: hidden; }
        .table thead { background-color: #34495e; color: white; }
        .table thead th { padding: 12px 15px !important; font-size: 0.95rem; }
        .table td { padding: 10px 15px !important; font-size: 0.9rem; border-bottom: 1px solid #eee; }
        .post-row { position: relative; }

        /* <a> 태그 스타일 */
        .post-link { text-decoration: none; color: #2c3e50; font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stretched-link::after { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 1; content: ""; }

        .post-date { color: #95a5a6; font-size: 0.85rem; }
    </style>
</head>
<body>

<header class="list-header text-center">
    <div class="container">
        <h2 class="fw-bold">🔍 자료 검색 아카이브</h2>
        <p class="mb-0">검색어를 입력하여 자료를 찾아보세요.</p>
    </div>
</header>

<div class="container">
    <div class="search-container">
        <input type="text" id="searchInput" class="form-control form-control-lg shadow" placeholder="제목 검색...">
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="post-table-container shadow-sm border">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th scope="col" class="text-center" style="width: 80px;">번호</th>
                            <th scope="col">제목</th>
                            <th scope="col" class="text-center" style="width: 120px;">날짜</th>
                        </tr>
                    </thead>
                    <tbody id="postTable">

                        <tr class="post-row">
                            <td class="text-center">001</td>
                            <td><a href="posts/data1.html" class="post-link stretched-link">자료 1번 제목</a></td>
                            <td class="text-center post-date">2026-02-17</td>
                        </tr>

                        <tr class="post-row">
                            <td class="text-center">002</td>
                            <td><a href="posts/data2.html" class="post-link stretched-link">자료 2번 제목</a></td>
                            <td class="text-center post-date">2026-02-17</td>
                        </tr>

                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // 검색 기능 스크립트 (기존 기능 유지)
    document.getElementById('searchInput').addEventListener('keyup', function() {
        const filter = this.value.toLowerCase();
        const rows = document.querySelectorAll('#postTable tr');
        rows.forEach(row => {
            const title = row.querySelector('.post-link').textContent.toLowerCase();
            row.style.display = title.includes(filter) ? '' : 'none';
        });
    });
</script>

</body>
</html>
